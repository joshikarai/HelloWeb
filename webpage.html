<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            text-align: center
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #555;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }
        main {
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        button {
            background-color: #4CAF50;
            color: white;
            font-size: 16px;    
            padding: 10px 20px;
            cursor: pointer;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 15px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My First Webpage</h1>
        <p>Welcome to my website!</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <main>
        <h1>Hello World!</h1>
        <p>This is my first webpage created using HTML and CSS.</p>
        <button>Click Me</button>
    </main>
    <footer>
        <p>&copy; 2026 Webpage.</p>
    </footer>
</body>
</html>
